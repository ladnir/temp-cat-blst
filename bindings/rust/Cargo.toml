[package]
name = "blst"
version = "0.3.15"
authors = ["sean-sn <sean@supranational.net>"]
edition = "2018"
license = "Apache-2.0"
description = "Bindings for blst BLS12-381 library"
repository = "https://github.com/supranational/blst"
readme = "README.md"
categories = ["cryptography"]
keywords = ["crypto", "bls", "signature", "asm", "wasm"]
include = [
    "**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/docs/**",
    "/rustfmt.toml",
    "/blst/src/*.c",
    "/blst/src/*.h*",
    "/blst/build/**",
    "/blst/bindings/blst.h",
    "/blst/bindings/blst_aux.h",
    "/blst/bindings/blst_types.h",
    "/blst/bindings/blst_scalar.h",
    "/blst/bindings/blst_avx.h",
    "/blst/bindings/blst_fft.h",
    "/blst/bindings/blst_middle_product.h",
]
links = "blst"

[features]
# By default, compile with ADX extension if the host supports it.
# Binary can be executed on systems similar to the host.
default = []
# Compile in portable mode, without ISA extensions.
# Binary can be executed on all systems.
portable = []
# Enable AVX-backed native code paths.
avx = []
# Enable ADX even if the host CPU doesn't support it.
# Binary can be executed on Broadwell+ and Ryzen+ systems.
force-adx = []
# Keep the full high-level Rust wrapper surface feature-gated while
# the smaller middle-product-first surface remains the default.
full-rust-bindings = []
# Add support for serializing SecretKey, not suitable for production.
serde-secret = ["serde"]

[dependencies]
zeroize = { version = "^1.1", features = ["zeroize_derive"] }
serde = { version = "1.0.152", optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["std"] }
rand_chacha = "0.3"
rmp-serde = "1.1.1"
# Uncomment if you want to execute the test suite with Rust 1.56 through 1.64.
#byteorder = "=1.4.3"
#rmp = "=0.8.12"
#ppv-lite86 = "=0.2.17"

[target.'cfg(any(unix, windows))'.dev-dependencies]
criterion = "0.3"

[[bench]]
name = "blst_benches"
harness = false

[profile.release]
#opt-level = 3

[badges]
maintenance = { status = "actively-developed" }
