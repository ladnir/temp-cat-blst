[package]
name = "category-blst-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rmp-serde = "1.3"
blst = { path = "..", features = ["full-rust-bindings", "portable", "serde-secret"] }

[[bin]]
name = "blst_rust_fuzz_decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blst_rust_fuzz_state"
path = "fuzz_targets/state.rs"
test = false
doc = false
bench = false
