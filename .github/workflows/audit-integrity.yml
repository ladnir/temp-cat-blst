name: Audit integrity

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  audit-manifests:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate file and upstream manifests
        shell: powershell
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/audit/check_audit_manifest.ps1

      - name: Validate raw Rust binding integrity
        shell: powershell
        run: >
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/audit/check_rust_bindings.ps1

  rust-binding-transform:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate binding transform
        shell: bash
        run: |
          bash -n build/generate-rust-bindings.sh
          perl -c build/bindings_trim.pl
          bash scripts/audit/test_bindings_trim.sh
