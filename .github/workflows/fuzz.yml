name: Fuzz corpus replay

on:
  pull_request:
    paths:
      - '.github/workflows/fuzz.yml'
      - 'CMakeLists.txt'
      - 'blst/**'
      - 'bindings/**'
      - 'test/fuzz/**'
      - 'scripts/fuzz/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fuzz.yml'
      - 'CMakeLists.txt'
      - 'blst/**'
      - 'bindings/**'
      - 'test/fuzz/**'
      - 'scripts/fuzz/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded fuzz operation
        required: true
        default: replay
        type: choice
        options:
          - replay
          - discovery
          - coverage-replay
          - apple-replay
          - portable-avx-replay
      seconds_per_target:
        description: Discovery seconds per target
        required: false
        default: '900'
        type: string

concurrency:
  group: category-blst-fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust fuzz toolchain
        run: rustup toolchain install nightly-2026-01-15 --profile minimal
      - name: Check adapter boundary and named coverage paths
        run: |
          python3 scripts/fuzz/check_structure.py --boundary-only --self-test
          python3 scripts/fuzz/check_coverage_paths.py --check-config --self-test
      - name: Check pinned safe Rust fuzz targets
        run: |
          cargo +nightly-2026-01-15 check \
            --locked \
            --manifest-path bindings/rust/fuzz/Cargo.toml \
            --bins \
            --jobs 2

  scalar-replay:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure scalar sanitizers
        run: bash scripts/fuzz/configure_scalar.sh out/fuzz-ci RelWithDebInfo
      - name: Replay retained corpora sequentially
        run: bash scripts/fuzz/replay.sh out/fuzz-ci
      - name: Install pinned Rust fuzz toolchain and runner
        run: |
          rustup toolchain install nightly-2026-01-15 --profile minimal
          cargo +nightly-2026-01-15 install cargo-fuzz --version 0.13.2 --locked
      - name: Replay safe Rust corpora sequentially
        run: bash scripts/fuzz/replay_rust.sh

  discovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure discovery profile
        run: bash scripts/fuzz/configure_scalar.sh out/fuzz-discovery RelWithDebInfo
      - name: Run one fuzz worker sequentially
        env:
          BLST_FUZZ_DISCOVERY_APPROVED: YES
        run: >-
          bash scripts/fuzz/discovery.sh out/fuzz-discovery
          '${{ inputs.seconds_per_target }}'
      - name: Install pinned Rust fuzz toolchain and runner
        run: |
          rustup toolchain install nightly-2026-01-15 --profile minimal
          cargo +nightly-2026-01-15 install cargo-fuzz --version 0.13.2 --locked
      - name: Run safe Rust discovery sequentially
        env:
          BLST_FUZZ_DISCOVERY_APPROVED: YES
        run: >-
          bash scripts/fuzz/discovery_rust.sh
          '${{ inputs.seconds_per_target }}'

  coverage-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coverage-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure LLVM source coverage
        run: >-
          bash scripts/fuzz/configure_scalar.sh
          out/fuzz-coverage RelWithDebInfo coverage
      - name: Replay retained corpora with coverage
        run: bash scripts/fuzz/coverage_replay.sh out/fuzz-coverage
      - name: Print descriptive coverage report
        run: cat out/fuzz-coverage/coverage/report.txt

  apple-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apple-replay'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Configure release-candidate replay
        run: bash scripts/fuzz/configure_scalar.sh out/fuzz-apple RelWithDebInfo
      - name: Replay retained corpora sequentially
        run: bash scripts/fuzz/replay.sh out/fuzz-apple

  portable-avx-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'portable-avx-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure developer AVX emulation
        run: bash scripts/fuzz/configure_avx.sh out/fuzz-avx-portable portable
      - name: Replay AVX corpus sequentially
        run: bash scripts/fuzz/replay_avx.sh out/fuzz-avx-portable
