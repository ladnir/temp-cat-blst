name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  cmake:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B out/build/ci \
            -DBLST_TEST=ON \
            -DBLST_BENCHMARK=OFF \
            -DBLST_CUDA=OFF \
            -DBLST_CUDA_MSM=OFF \
            -DBLST_PARALLEL_MSM=OFF \
            -DBLST_AVX512=OFF \
            -DBLST_AVX512_PORTABLE=OFF \
            -DBLST_DEFAULT_AVX=OFF \
            -DBLST_CRNS_BATCH_VROOM_VENDOR=OFF

      - name: Build
        shell: bash
        run: cmake --build out/build/ci --target blst_tests

      - name: Test
        shell: bash
        run: ctest --test-dir out/build/ci/test --output-on-failure

  rust:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Get date
        id: get-date
        shell: bash
        run: echo "date=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            **/Cargo.lock
            **/bindings/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.get-date.outputs.date }}

      - name: Test Rust crate
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ] && ! which cargo > /dev/null 2>&1; then
              export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version --verbose
          export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
          cd bindings/rust

          cargo test --release --lib
          cargo test --release --lib --features full-rust-bindings
          cargo test --release --lib --features portable
          cargo test --release --lib --features serde-secret
          cargo run --release --example smoke
          cargo run --release --example smoke --features full-rust-bindings
