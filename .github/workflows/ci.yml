name: build

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: supported-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cmake:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-scalar
            mode: scalar-cpp
          - os: ubuntu-24.04
            preset: linux
            mode: scalar-assembly
          - os: macos-15
            preset: macos-apple-silicon
            mode: scalar-assembly
          - os: windows-2025
            preset: x64-Release
            mode: scalar-assembly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        if: matrix.preset == 'macos-apple-silicon'
        shell: bash
        run: |
          test "${{ runner.arch }}" = "ARM64"
          test "$(uname -m)" = "arm64"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure
        shell: bash
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        shell: bash
        run: >
          cmake --build "out/build/${{ matrix.preset }}"
          --target blst_tests
          --parallel 4

      - name: Test
        shell: bash
        run: >
          ctest --test-dir "out/build/${{ matrix.preset }}/test"
          --output-on-failure --parallel 4

  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          test "${{ runner.arch }}" = "ARM64"
          test "$(uname -m)" = "arm64"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('bindings/rust/Cargo.lock') }}

      - name: Test Rust crate
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ] && ! which cargo > /dev/null 2>&1; then
              export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version --verbose
          export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
          cd bindings/rust

          policy_test="$RUNNER_TEMP/catblst-build-policy-tests"
          if [ "${{ runner.os }}" = "Windows" ]; then
              policy_test="$policy_test.exe"
          fi
          rustc --test build.rs -D warnings -o "$policy_test"
          "$policy_test"

          cargo test --locked --release --lib
          cargo test --locked --release --lib --features full-rust-bindings
          cargo test --locked --release --lib --features portable
          cargo test --locked --release --lib --features serde-secret
          cargo run --locked --release --example smoke
          cargo run --locked --release --example smoke --features full-rust-bindings

  rust-msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.78 MSRV toolchain
        shell: bash
        run: rustup toolchain install 1.78.0 --profile minimal

      - name: Check supported Rust feature surface at MSRV
        shell: bash
        working-directory: bindings/rust
        run: >
          cargo +1.78.0 check --locked --lib
          --features full-rust-bindings,portable,serde-secret
