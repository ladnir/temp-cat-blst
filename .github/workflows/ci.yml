name: build

on:
  push:
    branches:
      - codex/mac-ci-debug
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cmake:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            mode: scalar
            build_dir: out/build/ci-scalar
            compiler_flags: ""
            cmake_flags: >-
              -DBLST_AVX512=OFF
              -DBLST_AVX512_PORTABLE=OFF
              -DBLST_DEFAULT_AVX=OFF

    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLST_TEST=ON \
            -DBLST_BENCHMARK=OFF \
            -DBLST_CUDA=OFF \
            -DBLST_CUDA_MSM=OFF \
            -DBLST_PARALLEL_MSM=OFF \
            -DBLST_CRNS_BATCH_VROOM_VENDOR=OFF \
            ${{ matrix.compiler_flags }} \
            ${{ matrix.cmake_flags }}

      - name: Build
        shell: bash
        run: >
          cmake --build "${{ matrix.build_dir }}"
          --target blst_tests
          --parallel 4

      - name: Test
        shell: bash
        run: ctest --test-dir "${{ matrix.build_dir }}/test" --output-on-failure --parallel 4
