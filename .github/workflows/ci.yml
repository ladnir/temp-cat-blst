name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cmake:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: scalar
            build_dir: out/build/ci-scalar
            build_type: Release
            compiler_flags: ""
            cmake_flags: >-
              -DBLST_AVX512=OFF
              -DBLST_AVX512_PORTABLE=OFF
              -DBLST_DEFAULT_AVX=OFF
          - os: macos-15
            mode: scalar
            build_dir: out/build/ci-scalar
            build_type: Release
            compiler_flags: ""
            cmake_flags: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DBLST_AVX512=OFF
              -DBLST_AVX512_PORTABLE=OFF
              -DBLST_DEFAULT_AVX=OFF
          - os: ubuntu-latest
            mode: scalar-generic-asm
            build_dir: out/build/ci-scalar-generic-asm
            build_type: Release
            compiler_flags: ""
            cmake_flags: >-
              -DBLST_PORTABLE=ON
              -DBLST_ASM=ON
              -DBLST_ADX=OFF
              -DBLST_DEFAULT_ASM=ON
              -DBLST_AVX512=OFF
              -DBLST_AVX512_PORTABLE=OFF
              -DBLST_DEFAULT_AVX=OFF
          - os: windows-latest
            mode: scalar
            build_dir: out/build/ci-scalar
            build_type: Release
            compiler_flags: >-
              -DCMAKE_C_COMPILER=cl
              -DCMAKE_CXX_COMPILER=cl
            cmake_flags: >-
              -DBLST_AVX512=OFF
              -DBLST_AVX512_PORTABLE=OFF
              -DBLST_DEFAULT_AVX=OFF
          - os: ubuntu-latest
            mode: avx-portable-debug
            build_dir: out/build/ci-avx-portable-debug
            build_type: Debug
            compiler_flags: ""
            cmake_flags: >-
              -DBLST_AVX512=OFF
              -DBLST_AVX512_PORTABLE=ON
              -DBLST_DEFAULT_AVX=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          test "${{ runner.arch }}" = "ARM64"
          test "$(uname -m)" = "arm64"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBLST_TEST=ON \
            -DBLST_BENCHMARK=OFF \
            -DBLST_CUDA=OFF \
            -DBLST_CUDA_MSM=OFF \
            -DBLST_PARALLEL_MSM=OFF \
            -DBLST_CRNS_BATCH_VROOM_VENDOR=OFF \
            ${{ matrix.compiler_flags }} \
            ${{ matrix.cmake_flags }}

      - name: Build
        shell: bash
        run: >
          cmake --build "${{ matrix.build_dir }}"
          --target blst_tests
          --parallel 4

      - name: Test
        shell: bash
        run: ctest --test-dir "${{ matrix.build_dir }}/test" --output-on-failure --parallel 4

  rust:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          test "${{ runner.arch }}" = "ARM64"
          test "$(uname -m)" = "arm64"

      - name: Get date
        id: get-date
        shell: bash
        run: echo "date=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            **/Cargo.lock
            **/bindings/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.get-date.outputs.date }}

      - name: Test Rust crate
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ] && ! which cargo > /dev/null 2>&1; then
              export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version --verbose
          export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
          cd bindings/rust

          cargo test --release --lib
          cargo test --release --lib --features full-rust-bindings
          cargo test --release --lib --features portable
          cargo test --release --lib --features serde-secret
          cargo run --release --example smoke
          cargo run --release --example smoke --features full-rust-bindings
