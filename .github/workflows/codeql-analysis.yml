name: CodeQL

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # This private repository does not currently have GitHub Code Security.
    # Set the repository variable CODEQL_ENABLED=true only after enabling it.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: rust
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build retained C and C++ production sources
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          common_flags=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Debug
            -DBLST_BUILD_SHARED=OFF
            -DBLST_PORTABLE=ON
            -DBLST_ASM=OFF
            -DBLST_ADX=OFF
            -DBLST_TEST=OFF
            -DBLST_BENCHMARK=OFF
            -DBLST_CUDA=OFF
            -DBLST_CUDA_MSM=OFF
            -DBLST_PARALLEL_MSM=OFF
            -DBLST_CRNS_BATCH_VROOM_VENDOR=OFF
          )

          cmake -S . -B out/build/codeql-scalar \
            "${common_flags[@]}" \
            -DBLST_AVX512=OFF \
            -DBLST_AVX512_PORTABLE=OFF \
            -DBLST_DEFAULT_AVX=OFF
          cmake --build out/build/codeql-scalar \
            --target blst_static \
            --parallel 2

          # Portable AVX is intentionally analyzed in Debug. Release
          # optimization makes the full product compile too expensive for the
          # ordinary audit cycle.
          cmake -S . -B out/build/codeql-avx-portable \
            "${common_flags[@]}" \
            -DBLST_AVX512=OFF \
            -DBLST_AVX512_PORTABLE=ON \
            -DBLST_DEFAULT_AVX=ON
          cmake --build out/build/codeql-avx-portable \
            --target blst_static \
            --parallel 2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
